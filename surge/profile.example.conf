# ═══════════════════════════════════════════════════════════════
# Surge 主配置骨架
#
# 复制到 ~/Library/Application Support/Surge/Profiles/
# 本机作者模式：把仓库里的 dconf 软链进同目录，改完在 Surge 里重载即生效。
#   ln -s <仓库>/surge/general.dconf  <Profiles>/general.dconf
#   ln -s <仓库>/surge/groups.dconf   <Profiles>/groups.dconf
#   ln -s <仓库>/surge/rules.dconf    <Profiles>/rules.dconf
#
# 他人使用：把下面的本地文件名换成远程 URL，例如
#   #!include https://raw.githubusercontent.com/evo-lee/co-surge-rules-set/main/surge/rules.dconf
#   注意远程 include 会让该段在 Surge UI 中变为只读。
#
# 唯一需要你自己准备的是 nodes.dconf —— 它含凭证，永不进仓库。
# ═══════════════════════════════════════════════════════════════

[General]
#!include general.dconf

[Proxy]
#!include nodes.dconf

[Proxy Group]
#!include groups.dconf

[Rule]
#!include rules.dconf

[MITM]
# 证书由 Surge 自行生成，不在仓库管理范围内
